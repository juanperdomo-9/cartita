<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cartita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=DM+Sans:opsz,wght@9..40,400..700&family=Instrument+Serif:ital@0;1&family=Kalam:wght@400;700&family=Young+Serif&display=swap"
    />
    <!-- Tema antes de pintar, como el prototipo: lo elegido en "cartita-tema" o el del celular -->
    <script>
      (function () {
        var r = document.documentElement, g = null;
        try { g = localStorage.getItem("cartita-tema"); } catch (e) {}
        r.classList.toggle(
          "oscuro",
          g ? g === "oscuro" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
