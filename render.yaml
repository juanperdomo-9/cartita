# Blueprint de Render para Cartita: UN solo web service (Docker) con la API y la web.
# Los valores con `sync: false` se cargan a mano en el panel de Render (ver README).
# APP_BASE_URL y FRONTEND_URL no hacen falta: se toman de RENDER_EXTERNAL_URL.
services:
  - type: web
    # El nombre define la dirección: paravos.onrender.com (neutra, no spoilea la sorpresa)
    name: paravos
    runtime: docker
    plan: free
    # Misma zona que la base de Supabase (us-west-2, Oregon): menos demora en cada pedido
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENTORNO
        value: produccion
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: cartas
      - key: TOKEN_PEPPER
        generateValue: true
      - key: PAGOS_ACTIVOS
        value: "false"
