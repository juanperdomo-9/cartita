# Blueprint de Render para Cartita: backend (FastAPI) + frontend (static site).
# Los valores con `sync: false` se cargan a mano en el panel de Render (ver README).
services:
  - type: web
    name: cartita-backend
    runtime: python
    plan: free
    rootDir: backend
    # uv se usa porque backend/uv.lock existe. Las migraciones corren en el build porque el plan
    # free no tiene pre-deploy; si se pasa a un plan pago, moverlas a `preDeployCommand`.
    buildCommand: uv sync --frozen --no-dev && uv run --no-sync alembic upgrade head
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENTORNO
        value: produccion
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: cartas
      - key: TOKEN_PEPPER
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAGOS_ACTIVOS
        value: "false"

  - type: web
    name: cartita-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITIO_URL
        sync: false
